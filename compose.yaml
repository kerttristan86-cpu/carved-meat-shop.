services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_DIR: /data/production
      BETTER_AUTH_URL: https://${CARVED_DOMAIN:?Set CARVED_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret}
    volumes:
      - carved_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CARVED_DOMAIN: ${CARVED_DOMAIN:?Set CARVED_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  carved_data:
  caddy_data:
  caddy_config:
